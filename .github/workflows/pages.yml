# Publishes the site to GitHub Pages on every push to main.
#
# Why this exists: the built-in "pages build and deployment" job last ran on
# 4 Aug 01:06 UTC and never triggered again, which is the signature of the Pages
# source having been switched to "GitHub Actions". With that setting and no
# workflow in the repo, nothing ever builds and every push lands silently.
#
# The first version of this file used `path: .`, which hands the entire
# repository to the artifact step including .git. Publish the site, not the
# repository: everything is staged into _site first.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site, not the repository
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
