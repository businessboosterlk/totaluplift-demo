# Publishes this folder to GitHub Pages on every push to main.
#
# Why this exists: pushes stopped publishing after 4 Aug 01:06 UTC while every
# commit landed on the remote correctly. The usual cause is the Pages source
# being set to "GitHub Actions" with no workflow present, in which case nothing
# ever builds. This is that workflow.
#
# If the source is set to "Deploy from a branch" instead, this run fails loudly
# with "Pages site not configured for Actions", which is itself the answer.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
